<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สูตรคูณ 1-100</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --primary: #1a73e8;
    --primary-container: #d2e3fc;
    --on-primary-container: #041e49;
    --text: #202124;
    --text-muted: #5f6368;
    --border: #dadce0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --primary: #8ab4f8;
      --primary-container: #004a77;
      --on-primary-container: #c2e7ff;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: #3c4043;
    }
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
  }
  .container { width: 100%; max-width: 480px; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.25rem; margin: 0; }
  input[type="number"] {
    width: 110px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text);
    font-size: 1rem; text-align: center;
  }
  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    max-height: 220px; overflow-y: auto;
    padding: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    margin-bottom: 16px;
  }
  .btn-num {
    padding: 10px 0; border: none; border-radius: 10px;
    background: transparent; color: var(--text);
    font-size: 0.95rem; font-weight: 500; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-num:hover { background: var(--border); }
  .btn-num.active {
    background: var(--primary-container);
    color: var(--on-primary-container);
    font-weight: 700;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px;
  }
  .card-title {
    font-size: 1.1rem; font-weight: 700; color: var(--primary);
    margin: 0 0 12px 0; text-align: center;
  }
  .row {
    display: flex; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 1.05rem;
  }
  .row:last-child { border-bottom: none; }
  .ans { font-weight: 700; color: var(--primary); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>สูตรคูณ 1–100</h1>
    <input type="number" id="customInput" min="1" max="1000" value="2" placeholder="ใส่แม่...">
  </div>

  <div class="grid" id="selectorGrid"></div>

  <div class="card">
    <div class="card-title" id="tableTitle">สูตรคูณแม่ 2</div>
    <div id="tableBody"></div>
  </div>
</div>

<script>
  const grid = document.getElementById('selectorGrid');
  const title = document.getElementById('tableTitle');
  const body = document.getElementById('tableBody');
  const input = document.getElementById('customInput');
  let current = 2;

  // สร้างปุ่ม 1-100 ครั้งเดียว
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= 100; i++) {
    const btn = document.createElement('button');
    btn.className = 'btn-num' + (i === current ? ' active' : '');
    btn.textContent = i;
    btn.dataset.num = i;
    frag.appendChild(btn);
  }
  grid.appendChild(frag);

  function renderTable(num) {
    if (!num || num < 1) return;
    current = num;
    title.textContent = `สูตรคูณแม่ ${num}`;
    input.value = num;

    // อัปเดตสถานะปุ่มที่เลือก
    document.querySelectorAll('.btn-num').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.num) === num);
    });

    // สร้างตาราง x1 ถึง x12
    let html = '';
    for (let i = 1; i <= 12; i++) {
      html += `
        <div class="row">
          <span>${num} × ${i}</span>
          <span>=</span>
          <span class="ans">${(num * i).toLocaleString()}</span>
        </div>`;
    }
    body.innerHTML = html;
  }

  // ใช้ Event Delegation ป้องกัน Memory Leak และค้าง
  grid.addEventListener('click', (e) => {
    if (e.target.classList.contains('btn-num')) {
      renderTable(Number(e.target.dataset.num));
    }
  });

  input.addEventListener('input', (e) => {
    const val = parseInt(e.target.value, 10);
    if (val > 0) renderTable(val);
  });

  renderTable(2);
</script>

</body>
</html>
